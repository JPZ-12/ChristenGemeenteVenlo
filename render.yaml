services:
  - type: web
    name: christengemeentevenlo
    runtime: static
    branch: main
    buildCommand: "true"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
