<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="De website van Christen Gemeente Venlo is in ontwikkeling.">
    <meta name="theme-color" content="#31483d">
    <meta property="og:title" content="Christen Gemeente Venlo">
    <meta property="og:description" content="Onze website is in ontwikkeling. Binnenkort vind je hier meer informatie.">
    <meta property="og:type" content="website">
    <title>Christen Gemeente Venlo | In ontwikkeling</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles/site.css">
    <script src="assets/scripts/site.js" defer></script>
  </head>
  <body>
    <main class="site-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero__visual" aria-hidden="true"></div>
        <div class="hero__shade" aria-hidden="true"></div>

        <div class="hero__content">
          <p class="kicker">ChristenGemeente Venlo</p>
          <h1 id="page-title">Onze website is in ontwikkeling</h1>
          <p class="intro">
            Binnenkort vind je hier meer informatie over onze gemeente,
            samenkomsten en contactmogelijkheden.
          </p>

          <div class="status-bar" aria-label="Website status">
            <span class="status-bar__dot" aria-hidden="true"></span>
            <span>Under construction</span>
          </div>

          <a class="contact-link" href="mailto:info@christengemeentevenlo.nl">
            info@christengemeentevenlo.nl
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>&copy; <span data-current-year></span> ChristenGemeente Venlo</span>
      <span class="site-footer__divider" aria-hidden="true"></span>
      <span>Venlo</span>
    </footer>
  </body>
</html>
